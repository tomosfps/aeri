[package]
name = "aeri-api"
version = "0.1.0"
edition = "2024"

[dependencies]
colourful-logger = "2.0.1"
actix-web = "4.11.0"
reqwest = { version = "0.12.15", features = ["json", "socks"] }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
dotenvy = "0.15.7"
redis = { version = "0.31.0", features = ["aio", "streams", "tokio-comp"] }
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros"] }
rand = "0.9.1"
strsim = "0.11.1"
futures = "0.3.31"
actix-cors = "0.7.1"
prometheus-client = "0.23.1"